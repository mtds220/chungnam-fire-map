# Render Blueprint — 저장소를 연결하면 이 설정으로 웹 서비스가 만들어진다.
# 키 두 개(sync: false)는 Render 화면에서 직접 입력한다. 이 파일에는 절대 키 값을 적지 않는다.
services:
  - type: web
    name: chungnam-fire-access-map
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: KAKAO_JS_KEY
        sync: false
      - key: KAKAO_REST_KEY
        sync: false
      - key: MULTI_ORIGIN_RADIUS_M
        value: '10000'
      - key: SKIP_SPEED_KMH
        value: '150'
      - key: CACHE_TTL_HOURS
        value: '24'
      - key: ROUTES_PER_MIN
        value: '30'
      - key: PATHS_PER_MIN
        value: '120'
